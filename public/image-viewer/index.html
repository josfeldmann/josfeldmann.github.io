<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Large Image Viewer</title>

    <!--
        OpenSeadragon loaded locally.

        Expected location:
        ./openseadragon/openseadragon.min.js
    -->
    <script src="./openseadragon/openseadragon.min.js"></script>


    <style>

        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #1e1e1e;

            overflow: hidden;
        }


        button,
        input {
            font-family: inherit;
        }


        /* =========================================================
           APPLICATION LAYOUT
        ========================================================= */

        #app {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
        }


        /* =========================================================
           TOOLBAR
        ========================================================= */

        #toolbar {

            height: 58px;

            display: flex;
            align-items: center;

            gap: 10px;

            padding: 8px 12px;

            background: white;

            border-bottom:
                1px solid #bdbdbd;

            z-index: 100;

            flex-shrink: 0;
        }


        #uploadLabel {

            display: inline-flex;
            align-items: center;
            justify-content: center;

            height: 38px;

            padding: 0 16px;

            background: #222222;

            color: white;

            border-radius: 4px;

            cursor: pointer;

            font-size: 14px;

            user-select: none;
        }


        #uploadLabel:hover {
            background: #444444;
        }


        #imageInput {
            display: none;
        }


        .toolbarButton {

            height: 38px;

            padding: 0 14px;

            background: white;

            color: black;

            border:
                1px solid #aaaaaa;

            border-radius: 4px;

            cursor: pointer;

            font-size: 14px;
        }


        .toolbarButton:hover {
            background: #eeeeee;
        }


        .toolbarButton:disabled {

            opacity: 0.4;

            cursor: default;
        }


        #imageInfo {

            margin-left: 8px;

            color: #444444;

            font-size: 14px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =========================================================
           VIEWER AREA
        ========================================================= */

        #viewerContainer {

            position: relative;

            flex: 1;

            min-height: 0;

            background:
                #303030;

            overflow: hidden;
        }


        #viewer {

            width: 100%;
            height: 100%;

            background:
                #303030;
        }


        /* =========================================================
           EMPTY STATE
        ========================================================= */

        #emptyState {

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            text-align: center;

            color: white;

            z-index: 10;

            pointer-events: none;

            user-select: none;
        }


        #emptyState h1 {

            margin: 0 0 12px 0;

            font-size: 28px;

            font-weight: normal;
        }


        #emptyState p {

            margin: 0;

            color: #bbbbbb;

            font-size: 15px;
        }


        /* =========================================================
           LOADING OVERLAY
        ========================================================= */

        #loadingOverlay {

            position: absolute;

            inset: 0;

            display: none;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 16px;

            background:
                rgba(0, 0, 0, 0.75);

            color: white;

            z-index: 50;
        }


        .spinner {

            width: 42px;
            height: 42px;

            border-radius: 50%;

            border:
                4px solid rgba(255, 255, 255, 0.25);

            border-top-color:
                white;

            animation:
                spin 0.8s linear infinite;
        }


        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================================================
           STATUS PANEL
        ========================================================= */

        #statusPanel {

            position: absolute;

            bottom: 12px;
            left: 12px;

            padding: 8px 12px;

            background:
                rgba(0, 0, 0, 0.72);

            color: white;

            border-radius: 4px;

            font-size: 13px;

            z-index: 20;

            pointer-events: none;

            user-select: none;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {

            #toolbar {

                height: auto;

                flex-wrap: wrap;
            }


            #imageInfo {

                width: 100%;

                margin-left: 0;

                order: 2;
            }


            .toolbarButton {

                padding:
                    0 10px;
            }

        }

    </style>

</head>


<body>


<div id="app">


    <!-- =====================================================
         TOOLBAR
    ====================================================== -->

    <div id="toolbar">


        <label
            id="uploadLabel"
            for="imageInput"
        >
            Upload Image
        </label>


        <input
            id="imageInput"
            type="file"
            accept="image/png,image/jpeg,image/webp"
        >


        <button
            id="zoomInButton"
            class="toolbarButton"
            disabled
        >
            +
        </button>


        <button
            id="zoomOutButton"
            class="toolbarButton"
            disabled
        >
            −
        </button>


        <button
            id="resetButton"
            class="toolbarButton"
            disabled
        >
            Reset
        </button>


        <button
            id="fullscreenButton"
            class="toolbarButton"
            disabled
        >
            Fullscreen
        </button>


        <div id="imageInfo">

            No image loaded

        </div>


    </div>



    <!-- =====================================================
         VIEWER
    ====================================================== -->

    <div id="viewerContainer">


        <div id="viewer"></div>



        <!-- Empty State -->

        <div id="emptyState">

            <h1>Large Image Viewer</h1>

            <p>
                Upload an image to begin.
            </p>

            <p style="margin-top: 8px; font-size: 13px;">

                Pan with the mouse and zoom with the scroll wheel.

            </p>

        </div>



        <!-- Loading -->

        <div id="loadingOverlay">

            <div class="spinner"></div>

            <div id="loadingText">

                Loading image...

            </div>

        </div>



        <!-- Status -->

        <div id="statusPanel">

            No image loaded

        </div>


    </div>


</div>



<script>


/* =========================================================
   CONFIGURATION
========================================================= */


const OPENSEADRAGON_IMAGES_PATH =
    "./openseadragon/images/";



/* =========================================================
   DOM ELEMENTS
========================================================= */


const imageInput =
    document.getElementById(
        "imageInput"
    );


const emptyState =
    document.getElementById(
        "emptyState"
    );


const loadingOverlay =
    document.getElementById(
        "loadingOverlay"
    );


const loadingText =
    document.getElementById(
        "loadingText"
    );


const imageInfo =
    document.getElementById(
        "imageInfo"
    );


const statusPanel =
    document.getElementById(
        "statusPanel"
    );


const zoomInButton =
    document.getElementById(
        "zoomInButton"
    );


const zoomOutButton =
    document.getElementById(
        "zoomOutButton"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


const fullscreenButton =
    document.getElementById(
        "fullscreenButton"
    );



/* =========================================================
   APPLICATION STATE
========================================================= */


let currentObjectUrl = null;


let currentFileName = null;


let imageLoaded = false;



/* =========================================================
   CREATE OPENSEADRAGON VIEWER
========================================================= */


const viewer = OpenSeadragon({


    /*
        Element that contains the viewer.
    */

    id: "viewer",



    /*
        Local path to OpenSeadragon control images.
    */

    prefixUrl:
        OPENSEADRAGON_IMAGES_PATH,


    imageSmoothingEnabled:
        false,



    /*
        Disable the default OpenSeadragon controls.

        We use our own toolbar.
    */

    showNavigationControl:
        false,



    /*
        Show the overview navigator.

        This is especially useful for extremely
        large images.
    */

    showNavigator:
        true,


    navigatorPosition:
        OpenSeadragon.ControlAnchor.TOP_RIGHT,


    navigatorSizeRatio:
        0.16,


    navigatorAutoFade:
        false,



    /*
        Zoom settings.
    */

    minZoomImageRatio:
        0.8,


    maxZoomPixelRatio:
        4,


    zoomPerScroll:
        1.2,


    zoomPerClick:
        1.5,



    /*
        Movement animation.
    */

    animationTime:
        0.35,


    springStiffness:
        8,


    blendTime:
        0.1,



    /*
        Keep image reasonably constrained
        while panning.
    */

    constrainDuringPan:
        true,


    visibilityRatio:
        0.5,



    /*
        Mouse controls.
    */

    gestureSettingsMouse: {

        scrollToZoom:
            true,


        clickToZoom:
            false,


        dblClickToZoom:
            true,


        dragToPan:
            true

    },



    /*
        Touch controls.
    */

    gestureSettingsTouch: {

        scrollToZoom:
            true,


        clickToZoom:
            false,


        dblClickToZoom:
            true,


        dragToPan:
            true,


        pinchToZoom:
            true

    }


});



/* =========================================================
   FILE UPLOAD
========================================================= */


imageInput.addEventListener(
    "change",
    handleImageUpload
);



async function handleImageUpload(event) {


    const file =
        event.target.files[0];



    if (!file) {

        return;

    }



    /*
        Revoke the previous image URL.

        This prevents old images from staying
        allocated in browser memory.
    */

    if (currentObjectUrl) {

        URL.revokeObjectURL(
            currentObjectUrl
        );


        currentObjectUrl = null;

    }



    currentFileName =
        file.name;



    imageLoaded =
        false;



    /*
        Disable controls while loading.
    */

    setControlsEnabled(
        false
    );



    /*
        Show loading screen.
    */

    loadingText.textContent =
        "Preparing image...";


    loadingOverlay.style.display =
        "flex";


    emptyState.style.display =
        "none";


    imageInfo.textContent =
        "Loading " + file.name;


    statusPanel.textContent =
        "Loading...";



    /*
        Create a browser-local URL.

        The image is never uploaded to
        a remote server.
    */

    currentObjectUrl =
        URL.createObjectURL(
            file
        );



    /*
        Close the currently loaded image.

        This helps OpenSeadragon release
        references to the old tile source.
    */

    viewer.close();



    /*
        Open a normal image using ImageTileSource.

        buildPyramid: true tells OpenSeadragon
        to construct an internal image pyramid
        rather than treating the image as a
        single zoom level.

        No DZI file is required.
    */

    viewer.open({

        type:
            "image",


        url:
            currentObjectUrl,


        buildPyramid:
            true


    });


}



/* =========================================================
   IMAGE SUCCESSFULLY OPENED
========================================================= */


viewer.addHandler(
    "open",
    function () {


        imageLoaded =
            true;



        loadingOverlay.style.display =
            "none";



        setControlsEnabled(
            true
        );



        /*
            Get information about the image.
        */

        const tiledImage =
            viewer.world.getItemAt(
                0
            );



        if (!tiledImage) {

            return;

        }



        const contentSize =
            tiledImage.getContentSize();



        const width =
            Math.round(
                contentSize.x
            );


        const height =
            Math.round(
                contentSize.y
            );



        imageInfo.textContent =

            currentFileName +

            " — " +

            width.toLocaleString() +

            " × " +

            height.toLocaleString() +

            " pixels";



        updateStatus();


    }
);



/* =========================================================
   LOAD FAILURE
========================================================= */


viewer.addHandler(
    "open-failed",
    function (event) {


        imageLoaded =
            false;



        loadingOverlay.style.display =
            "none";


        emptyState.style.display =
            "block";



        imageInfo.textContent =
            "Failed to load image";


        statusPanel.textContent =
            "Image loading failed";



        setControlsEnabled(
            false
        );



        console.error(
            "OpenSeadragon failed to load image:",
            event
        );


    }
);



/* =========================================================
   TOOLBAR BUTTONS
========================================================= */


zoomInButton.addEventListener(
    "click",
    function () {


        if (!imageLoaded) {

            return;

        }



        viewer.viewport.zoomBy(
            1.4
        );


        viewer.viewport.applyConstraints();


    }
);



zoomOutButton.addEventListener(
    "click",
    function () {


        if (!imageLoaded) {

            return;

        }



        viewer.viewport.zoomBy(
            1 / 1.4
        );


        viewer.viewport.applyConstraints();


    }
);



resetButton.addEventListener(
    "click",
    function () {


        if (!imageLoaded) {

            return;

        }



        viewer.viewport.goHome(
            true
        );


    }
);



fullscreenButton.addEventListener(
    "click",
    function () {


        if (!imageLoaded) {

            return;

        }



        viewer.setFullScreen(
            !viewer.isFullPage()
        );


    }
);



/* =========================================================
   ENABLE / DISABLE CONTROLS
========================================================= */


function setControlsEnabled(enabled) {


    zoomInButton.disabled =
        !enabled;


    zoomOutButton.disabled =
        !enabled;


    resetButton.disabled =
        !enabled;


    fullscreenButton.disabled =
        !enabled;


}



/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */


document.addEventListener(
    "keydown",
    function (event) {


        if (!imageLoaded) {

            return;

        }



        /*
            Do not trigger shortcuts when
            typing in an input.
        */

        if (

            event.target.tagName === "INPUT" ||

            event.target.tagName === "TEXTAREA"

        ) {

            return;

        }



        switch (event.key) {


            /*
                Zoom in.
            */

            case "+":

            case "=":

                viewer.viewport.zoomBy(
                    1.25
                );


                viewer.viewport.applyConstraints();

                break;



            /*
                Zoom out.
            */

            case "-":

            case "_":

                viewer.viewport.zoomBy(
                    1 / 1.25
                );


                viewer.viewport.applyConstraints();

                break;



            /*
                Reset view.
            */

            case "0":

            case "Home":

                viewer.viewport.goHome(
                    true
                );

                break;



            /*
                Toggle fullscreen.
            */

            case "f":

            case "F":

                viewer.setFullScreen(
                    !viewer.isFullPage()
                );

                break;


        }


    }
);



/* =========================================================
   STATUS DISPLAY
========================================================= */


/*
    Update the zoom display whenever
    the viewport changes.
*/


viewer.addHandler(
    "animation",
    updateStatus
);


viewer.addHandler(
    "viewport-change",
    updateStatus
);



function updateStatus() {


    if (!imageLoaded) {

        return;

    }



    const currentZoom =
        viewer.viewport.getZoom();



    const homeZoom =
        viewer.viewport.getHomeZoom();



    /*
        Calculate zoom relative to
        the initial fitted image size.
    */

    const zoomPercentage =

        Math.round(

            (currentZoom / homeZoom) * 100

        );



    statusPanel.textContent =

        "Zoom: " +

        zoomPercentage +

        "%";


}



/* =========================================================
   MEMORY CLEANUP
========================================================= */


window.addEventListener(
    "beforeunload",
    function () {


        if (currentObjectUrl) {

            URL.revokeObjectURL(
                currentObjectUrl
            );

        }


    }
);


</script>


</body>
</html>
