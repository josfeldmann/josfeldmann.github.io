<body>


<div id="app">


    <!-- =====================================================
         TOOLBAR
    ====================================================== -->

    <div id="toolbar">


        <!-- =================================================
             LOCAL FILE UPLOAD
        ================================================== -->

        <label
            id="uploadLabel"
            for="imageInput"
        >
            Upload Image
        </label>


        <input
            id="imageInput"
            type="file"
            accept="image/png,image/jpeg,image/webp"
        >


        <!-- =================================================
             IMAGE URL
        ================================================== -->

        <input
            id="urlInput"
            type="url"
            placeholder="Image URL..."
            autocomplete="off"
        >


        <button
            id="loadUrlButton"
        >
            Load URL
        </button>


        <!-- =================================================
             VIEWER CONTROLS
        ================================================== -->

        <button
            id="zoomInButton"
            class="toolbarButton"
            disabled
        >
            +
        </button>


        <button
            id="zoomOutButton"
            class="toolbarButton"
            disabled
        >
            −
        </button>


        <button
            id="resetButton"
            class="toolbarButton"
            disabled
        >
            Reset
        </button>


        <button
            id="fullscreenButton"
            class="toolbarButton"
            disabled
        >
            Fullscreen
        </button>


        <!-- =================================================
             IMAGE INFORMATION
        ================================================== -->

        <div id="imageInfo">

            No image loaded

        </div>


    </div>



    <!-- =====================================================
         VIEWER
    ====================================================== -->

    <div id="viewerContainer">


        <div id="viewer"></div>


        <!-- =================================================
             EMPTY STATE
        ================================================== -->

        <div id="emptyState">

            <h1>
                Large Image Viewer
            </h1>


            <p>
                Upload an image, enter an image URL,
                or drag an image here.
            </p>


            <p
                style="
                    margin-top: 8px;
                    font-size: 13px;
                "
            >
                Pan with the mouse and zoom with
                the scroll wheel.
            </p>

        </div>


        <!-- =================================================
             LOADING
        ================================================== -->

        <div id="loadingOverlay">

            <div class="spinner"></div>

            <div id="loadingText">

                Loading image...

            </div>

        </div>


        <!-- =================================================
             STATUS
        ================================================== -->

        <div id="statusPanel">

            No image loaded

        </div>


    </div>


</div>



<script>


/* =========================================================
   CONFIGURATION
========================================================= */


const OPENSEADRAGON_IMAGES_PATH =
    "./openseadragon/images/";



/* =========================================================
   DOM ELEMENTS
========================================================= */


const imageInput =
    document.getElementById(
        "imageInput"
    );


const urlInput =
    document.getElementById(
        "urlInput"
    );


const loadUrlButton =
    document.getElementById(
        "loadUrlButton"
    );


const viewerContainer =
    document.getElementById(
        "viewerContainer"
    );


const emptyState =
    document.getElementById(
        "emptyState"
    );


const loadingOverlay =
    document.getElementById(
        "loadingOverlay"
    );


const loadingText =
    document.getElementById(
        "loadingText"
    );


const imageInfo =
    document.getElementById(
        "imageInfo"
    );


const statusPanel =
    document.getElementById(
        "statusPanel"
    );


const zoomInButton =
    document.getElementById(
        "zoomInButton"
    );


const zoomOutButton =
    document.getElementById(
        "zoomOutButton"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


const fullscreenButton =
    document.getElementById(
        "fullscreenButton"
    );



/* =========================================================
   APPLICATION STATE
========================================================= */


let currentObjectUrl =
    null;


let currentFileName =
    null;


let imageLoaded =
    false;



/* =========================================================
   CREATE OPENSEADRAGON VIEWER
========================================================= */


const viewer =
    OpenSeadragon({

        /*
            Element that contains the viewer.
        */

        id:
            "viewer",


        /*
            Local path to OpenSeadragon
            control images.
        */

        prefixUrl:
            OPENSEADRAGON_IMAGES_PATH,


        /*
            Disable browser image smoothing
            where supported.

            This helps preserve crisp
            pixel-art images.
        */

        imageSmoothingEnabled:
            false,


        /*
            Required when loading images
            from another domain that supports
            CORS.
        */

        crossOriginPolicy:
            "Anonymous",


        /*
            Disable default controls.

            We use our own toolbar.
        */

        showNavigationControl:
            false,


        /*
            Show overview navigator.

            Useful for extremely large images.
        */

        showNavigator:
            true,


        navigatorPosition:
            OpenSeadragon.ControlAnchor.TOP_RIGHT,


        navigatorSizeRatio:
            0.16,


        navigatorAutoFade:
            false,


        /*
            Zoom settings.
        */

        minZoomImageRatio:
            0.8,


        maxZoomPixelRatio:
            4,


        zoomPerScroll:
            1.2,


        zoomPerClick:
            1.5,


        /*
            Movement animation.
        */

        animationTime:
            0.35,


        springStiffness:
            8,


        blendTime:
            0.1,


        /*
            Keep image reasonably constrained
            while panning.
        */

        constrainDuringPan:
            true,


        visibilityRatio:
            0.5,


        /*
            Mouse controls.
        */

        gestureSettingsMouse: {

            scrollToZoom:
                true,

            clickToZoom:
                false,

            dblClickToZoom:
                true,

            dragToPan:
                true

        },


        /*
            Touch controls.
        */

        gestureSettingsTouch: {

            scrollToZoom:
                true,

            clickToZoom:
                false,

            dblClickToZoom:
                true,

            dragToPan:
                true,

            pinchToZoom:
                true

        }

    });



/* =========================================================
   LOCAL FILE UPLOAD
========================================================= */


imageInput.addEventListener(
    "change",
    handleImageUpload
);



function handleImageUpload(event) {

    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    /*
        Verify that the selected file
        is actually an image.
    */

    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        imageInfo.textContent =
            "Selected file is not an image";

        statusPanel.textContent =
            "Please select an image file";

        return;

    }


    /*
        Revoke the previous object URL.

        This prevents old images from remaining
        allocated in browser memory.
    */

    revokeCurrentObjectUrl();


    /*
        Create a browser-local URL.

        The image is never uploaded
        to a remote server.
    */

    currentObjectUrl =
        URL.createObjectURL(
            file
        );


    currentFileName =
        file.name;


    loadImage(
        currentObjectUrl,
        currentFileName
    );

}



/* =========================================================
   URL INPUT
========================================================= */


loadUrlButton.addEventListener(
    "click",
    handleUrlLoad
);



urlInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            handleUrlLoad();

        }

    }
);



function handleUrlLoad() {

    const url =
        urlInput.value.trim();


    if (!url) {

        return;

    }


    loadImageFromUrl(
        url
    );

}



/* =========================================================
   LOAD IMAGE FROM REMOTE URL
========================================================= */


function loadImageFromUrl(url) {

    /*
        Try to extract a useful filename
        from the URL.

        Example:

        https://example.com/images/Alshocka.png

        becomes:

        Alshocka.png
    */

    let fileName =
        "Remote image";


    try {

        const parsedUrl =
            new URL(
                url,
                window.location.href
            );


        const pathname =
            parsedUrl.pathname;


        const lastPart =
            pathname.substring(
                pathname.lastIndexOf("/") + 1
            );


        if (lastPart) {

            fileName =
                decodeURIComponent(
                    lastPart
                );

        }

    }
    catch(error) {

        console.warn(
            "Could not parse image URL:",
            error
        );

    }


    loadImage(
        url,
        fileName
    );

}



/* =========================================================
   GENERIC IMAGE LOADER
========================================================= */


function loadImage(
    imageUrl,
    imageName
) {

    currentFileName =
        imageName;


    imageLoaded =
        false;


    /*
        Disable controls while loading.
    */

    setControlsEnabled(
        false
    );


    /*
        Show loading screen.
    */

    loadingText.textContent =
        "Loading image...";


    loadingOverlay.style.display =
        "flex";


    emptyState.style.display =
        "none";


    imageInfo.textContent =
        "Loading " + imageName;


    statusPanel.textContent =
        "Loading...";


    /*
        Close the currently loaded image.

        This helps OpenSeadragon release
        references to the old tile source.
    */

    viewer.close();


    /*
        Open a normal image using ImageTileSource.

        buildPyramid: true tells OpenSeadragon
        to construct an internal image pyramid
        rather than treating the image as a
        single zoom level.

        No DZI file is required.
    */

    viewer.open({

        type:
            "image",

        url:
            imageUrl,

        buildPyramid:
            true

    });

}



/* =========================================================
   LOAD IMAGE FROM PAGE URL
========================================================= */


/*
    Supports:

        imageviewer.html?image=https://example.com/image.png

    URLSearchParams handles URL encoding.

    Example:

        ?image=https%3A%2F%2Fexample.com%2Fimage.png
*/


function loadImageFromPageParameter() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const imageUrl =
        params.get(
            "image"
        );


    if (!imageUrl) {

        return;

    }


    /*
        Put the URL into the input as well,
        so the user can see what is loaded.
    */

    urlInput.value =
        imageUrl;


    loadImageFromUrl(
        imageUrl
    );

}



/*
    Automatically check for an image URL
    when the page loads.
*/

loadImageFromPageParameter();



/* =========================================================
   DRAG AND DROP
========================================================= */


/*
    Dragging only works over the viewer.

    This prevents accidentally loading an image
    when dropping a file onto the toolbar.
*/


viewerContainer.addEventListener(
    "dragover",
    handleDragOver
);


viewerContainer.addEventListener(
    "dragleave",
    handleDragLeave
);


viewerContainer.addEventListener(
    "drop",
    handleDrop
);



function handleDragOver(event) {

    /*
        Prevent the browser from opening
        the dropped file as a new page.
    */

    event.preventDefault();


    /*
        Tell the browser that the drop
        operation is allowed.
    */

    event.dataTransfer.dropEffect =
        "copy";


    /*
        Only show the drag-over state
        when the dragged item contains files.
    */

    if (

        event.dataTransfer &&

        event.dataTransfer.types.includes(
            "Files"
        )

    ) {

        viewerContainer.classList.add(
            "dragOver"
        );

    }

}



function handleDragLeave(event) {

    /*
        Remove the visual state when
        the cursor leaves the viewer.
    */

    viewerContainer.classList.remove(
        "dragOver"
    );

}



function handleDrop(event) {

    /*
        Prevent the browser's default behavior,
        which would otherwise navigate to the
        dropped image.
    */

    event.preventDefault();


    viewerContainer.classList.remove(
        "dragOver"
    );


    const files =
        event.dataTransfer.files;


    if (
        !files ||
        files.length === 0
    ) {

        return;

    }


    /*
        Find the first image file.

        This prevents accidentally trying
        to load a text file or other
        non-image file.
    */

    let imageFile =
        null;


    for (
        const file of files
    ) {

        if (
            file.type.startsWith(
                "image/"
            )
        ) {

            imageFile =
                file;

            break;

        }

    }


    if (!imageFile) {

        imageInfo.textContent =
            "Dropped file is not an image";


        statusPanel.textContent =
            "Please drop an image file";


        return;

    }


    /*
        Revoke the previous object URL.
    */

    revokeCurrentObjectUrl();


    /*
        Create a temporary browser-local
        URL for the dropped image.
    */

    currentObjectUrl =
        URL.createObjectURL(
            imageFile
        );


    currentFileName =
        imageFile.name;


    /*
        Load the image using the same
        function used by every other
        image-loading method.
    */

    loadImage(
        currentObjectUrl,
        currentFileName
    );

}



/* =========================================================
   OBJECT URL CLEANUP
========================================================= */


function revokeCurrentObjectUrl() {

    if (
        currentObjectUrl
    ) {

        URL.revokeObjectURL(
            currentObjectUrl
        );


        currentObjectUrl =
            null;

    }

}



/* =========================================================
   IMAGE SUCCESSFULLY OPENED
========================================================= */


viewer.addHandler(
    "open",
    function() {

        imageLoaded =
            true;


        loadingOverlay.style.display =
            "none";


        setControlsEnabled(
            true
        );


        /*
            Get information about the image.
        */

        const tiledImage =
            viewer.world.getItemAt(
                0
            );


        if (!tiledImage) {

            return;

        }


        const contentSize =
            tiledImage.getContentSize();


        const width =
            Math.round(
                contentSize.x
            );


        const height =
            Math.round(
                contentSize.y
            );


        imageInfo.textContent =

            currentFileName +

            " — " +

            width.toLocaleString() +

            " × " +

            height.toLocaleString() +

            " pixels";


        updateStatus();

    }
);



/* =========================================================
   LOAD FAILURE
========================================================= */


viewer.addHandler(
    "open-failed",
    function(event) {

        imageLoaded =
            false;


        loadingOverlay.style.display =
            "none";


        emptyState.style.display =
            "block";


        imageInfo.textContent =
            "Failed to load image";


        statusPanel.textContent =
            "Image loading failed";


        setControlsEnabled(
            false
        );


        console.error(
            "OpenSeadragon failed to load image:",
            event
        );

    }
);



/* =========================================================
   TOOLBAR BUTTONS
========================================================= */


/*
    Zoom in.
*/

zoomInButton.addEventListener(
    "click",
    function() {

        if (!imageLoaded) {

            return;

        }


        viewer.viewport.zoomBy(
            1.4
        );


        viewer.viewport.applyConstraints();

    }
);



/*
    Zoom out.
*/

zoomOutButton.addEventListener(
    "click",
    function() {

        if (!imageLoaded) {

            return;

        }


        viewer.viewport.zoomBy(
            1 / 1.4
        );


        viewer.viewport.applyConstraints();

    }
);



/*
    Reset view.
*/

resetButton.addEventListener(
    "click",
    function() {

        if (!imageLoaded) {

            return;

        }


        viewer.viewport.goHome(
            true
        );

    }
);



/*
    Fullscreen.
*/

fullscreenButton.addEventListener(
    "click",
    function() {

        if (!imageLoaded) {

            return;

        }


        viewer.setFullScreen(
            !viewer.isFullPage()
        );

    }
);



/* =========================================================
   ENABLE / DISABLE CONTROLS
========================================================= */


function setControlsEnabled(
    enabled
) {

    zoomInButton.disabled =
        !enabled;


    zoomOutButton.disabled =
        !enabled;


    resetButton.disabled =
        !enabled;


    fullscreenButton.disabled =
        !enabled;

}



/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */


document.addEventListener(
    "keydown",
    function(event) {

        if (!imageLoaded) {

            return;

        }


        /*
            Do not trigger shortcuts when
            typing in an input.
        */

        if (

            event.target.tagName ===
                "INPUT" ||

            event.target.tagName ===
                "TEXTAREA"

        ) {

            return;

        }


        switch(event.key) {


            /*
                Zoom in.
            */

            case "+":

            case "=":

                viewer.viewport.zoomBy(
                    1.25
                );


                viewer.viewport.applyConstraints();


                break;



            /*
                Zoom out.
            */

            case "-":

            case "_":

                viewer.viewport.zoomBy(
                    1 / 1.25
                );


                viewer.viewport.applyConstraints();


                break;



            /*
                Reset view.
            */

            case "0":

            case "Home":

                viewer.viewport.goHome(
                    true
                );


                break;



            /*
                Toggle fullscreen.
            */

            case "f":

            case "F":

                viewer.setFullScreen(
                    !viewer.isFullPage()
                );


                break;

        }

    }
);



/* =========================================================
   STATUS DISPLAY
========================================================= */


/*
    Update the zoom display whenever
    the viewport changes.
*/

viewer.addHandler(
    "animation",
    updateStatus
);


viewer.addHandler(
    "viewport-change",
    updateStatus
);



function updateStatus() {

    if (!imageLoaded) {

        return;

    }


    const currentZoom =
        viewer.viewport.getZoom();


    const homeZoom =
        viewer.viewport.getHomeZoom();


    /*
        Calculate zoom relative to
        the initial fitted image size.
    */

    const zoomPercentage =

        Math.round(

            (
                currentZoom /
                homeZoom
            ) * 100

        );


    statusPanel.textContent =

        "Zoom: " +

        zoomPercentage +

        "%";

}



/* =========================================================
   MEMORY CLEANUP
========================================================= */


window.addEventListener(
    "beforeunload",
    function() {

        revokeCurrentObjectUrl();

    }
);


</script>
